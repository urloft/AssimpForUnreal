; Default configuration for AssimpForUnreal.
;
; These values seed UAssimpForUnrealSettings the first time the plugin is enabled. Users override
; them in Project Settings > Plugins > Assimp For Unreal, which writes to the project's DefaultEngine.ini.
;
; Note on the claimed extension list: UInterchangeManager stores translators in a
; TSet<TObjectPtr<const UClass>> and GetTranslatorForSourceData returns the first entry that accepts
; the file, so when two translators claim one extension the winner is set-iteration order --
; unspecified, and not something a plugin can influence. Interchange offers no way to unregister or
; deny a translator either.
;
; Consequently the bClaim* switches below are only meaningful on a SOURCE engine build where the
; competing RegisterTranslator call in InterchangeImportModule.cpp has been removed. On a launcher
; build, route an OBJ/FBX/glTF file through Assimp by using the AssimpRuntime API (which bypasses
; Interchange) or by renaming it to an extension no other translator claims.

[/Script/AssimpInterchange.AssimpForUnrealSettings]
bClaimObj=False
bClaimFbx=False
bClaimGltf=False
bLogSupportedFormatsOnStartup=False
